# Nginx site config for Liftwise.
#
# Copy to /etc/nginx/sites-available/liftwise, replace YOUR_DOMAIN, symlink
# into sites-enabled, then run `sudo certbot --nginx -d YOUR_DOMAIN` — certbot
# rewrites this file in place to add the HTTPS server block and the
# HTTP->HTTPS redirect, so this file only needs to describe the plain HTTP
# server to start with. See DEPLOYMENT.md for the full sequence.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /opt/liftwise/dist;
    index modern.html;

    # Liftwise uses hash-based client routing (#today, #train, ...), so
    # there is no server-side route to fall back to index.html for -
    # every real path below is a literal file in dist/.

    location = / {
        return 302 /modern.html;
    }

    # Proxy everything under /api to the Node backend (see liftwise.service).
    # Cookie/Host/X-Forwarded-* headers matter: the backend's session cookie
    # is httpOnly + (in production) Secure, and server/app.ts only trusts
    # X-Forwarded-For for req.ip when TRUST_PROXY=1 is set in the service's
    # environment.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|svg|png|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
